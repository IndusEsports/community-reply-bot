# One block per game. Copy the whole "indus" block and rename the key + `slug`
# to add another. The bot only states facts written in `faq` below — it will
# not invent release dates, prices, or promises. Platform connections (YouTube/
# Instagram/X tokens) are no longer configured here — connect them from the
# dashboard's /connections page instead; they're stored in Supabase.

indus:
  slug: indus
  display_name: "Showdown FPS"
  about: >
    Showdown is a competitive first-person shooter built on Roblox, made by Indus
    Esports. Fast-paced arena matches, skill-based weapons, ranked play.
  support_hint: >
    For bugs or account issues, ask the player to describe what happened and
    report it on the official Discord support channel — do not promise a fix
    date or compensation.
  faq:
    - q: "When is the next update / season?"
      a: "We don't have a public date yet — announcements go out on Discord and the socials first."
    - q: "How do I report a bug?"
      a: "Post it in the #bug-reports channel on our Discord with your device and what happened."
    - q: "Is this on mobile / console?"
      a: "Currently Showdown is playable on Roblox, which supports PC, mobile, and console."
  # Optional, used by the "VIP priority review" automation (off by default) —
  # authors in this list always get held for manual review, never auto-sent.
  # vip_authors:
  #   - "SomeModName"
  #   - "PartnerCreatorHandle"
