<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Community Reply Bot</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand" style="justify-content:center; padding-bottom:20px;">
        <span class="brand-mark">CR</span>
        <span class="brand-name">Reply Bot</span>
      </div>
      {% if error %}<p class="status-error" style="text-align:center">{{ error }}</p>{% endif %}
      <form method="post" action="/login" class="tiktok-form">
        <label>Username<input type="text" name="username" required autofocus /></label>
        <label>Password<input type="password" name="password" required /></label>
        <button type="submit" class="approve" style="align-self:stretch; text-align:center;">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
